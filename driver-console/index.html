    <script>
      (function () {
        "use strict";

        const TOKEN_KEY = "romeos_driver_token";
        const USERNAME_KEY = "romeos_driver_username";
        const ROLE_KEY = "romeos_driver_role";

        // Theme management
        const htmlEl = document.documentElement;
        const themeToggleBtn = document.getElementById("theme-toggle");
        const themeIcon = document.getElementById("theme-icon");
        const metaThemeColor = document.querySelector('meta[name="theme-color"]');

        function applyTheme(theme) {
          htmlEl.setAttribute("data-theme", theme);
          localStorage.setItem("romeos-theme", theme);
          if (theme === "dark") {
            themeToggleBtn.setAttribute("aria-pressed", "true");
            themeIcon.className = "fa-solid fa-moon";
            if (metaThemeColor) metaThemeColor.setAttribute("content", "#161114");
          } else {
            themeToggleBtn.setAttribute("aria-pressed", "false");
            themeIcon.className = "fa-solid fa-sun";
            if (metaThemeColor) metaThemeColor.setAttribute("content", "#5C1A2B");
          }
        }

        const savedTheme = localStorage.getItem("romeos-theme") || "light";
        applyTheme(savedTheme);

        themeToggleBtn.addEventListener("click", () => {
          const cur = htmlEl.getAttribute("data-theme") || "light";
          applyTheme(cur === "dark" ? "light" : "dark");
        });

        // DOM elements
        const authSection = document.getElementById("auth-section");
        const deliveriesSection = document.getElementById("deliveries-section");
        const loginForm = document.getElementById("driver-login-form");
        const loginUserInput = document.getElementById("login-username");
        const loginPassInput = document.getElementById("login-password");
        const userCount = document.getElementById("user-count");
        const passCount = document.getElementById("pass-count");
        const loginError = document.getElementById("login-error");
        const loginBtn = document.getElementById("login-btn");
        const fillDemoCredsBtn = 
        }

        // Auth submit
        loginForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          loginError.hidden = true;
          loginBtn.disabled = true;
          loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`;

          const username = loginUserInput.value.trim();
          const password = loginPassInput.value.trim();

          try {
            const res = await fetch(`${getApiBase()}/api/admin`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "login", username, password, requiredRole: "driver" }),
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
              loginError.textContent = data.error || "Authentication failed. Invalid rider credentials.";
              loginError.hidden = false;
              loginBtn.disabled = false;
              loginBtn.innerHTML = `<i class="fa-solid fa-unlock-keyhole"></i> Sign In to Rider Console`;
              return;
            }

            if (data.role !== "driver") {
              loginError.textContent = "Access denied: This console is reserved strictly for Delivery Drivers.";
              loginError.hidden = false;
              loginBtn.disabled = false;
              loginBtn.innerHTML = `<i class="fa-solid fa-unlock-keyhole"></i> Sign In to Rider Console`;
              return;
            }

            sessionStorage.setItem(TOKEN_KEY, data.token);
            sessionStorage.setItem(USERNAME_KEY, data.username);
            sessionStorage.setItem(ROLE_KEY, data.role);

            showToast(`Signed in as Rider ${data.username}`);
            enterConsoleMode(data.username, data.role);
          } catch (_) {
            loginError.textContent = "Network error connecting to verification server.";
            loginError.hidden = false;
            loginBtn.disabled = false;
            loginBtn.innerHTML = `<i class="fa-solid fa-unlock-keyhole"></i> Sign In to Rider Console`;
          }
        });

        function enterConsoleMode(username, role) {
          authSection.hidden = true;
          deliveriesSection.hidden = false;
          riderStatusBadge.hidden = false;
          refreshBtn.hidden = false;
          logoutBtn.hidden = false;
          riderStatusBadge.innerHTML = `<i class="fa-solid fa-motorcycle"></i> ${esc(username)}`;

          fetchDeliveries();
          if (refreshInterval) clearInterval(refreshInterval);
          refreshInterval = setInterval(fetchDeliveries, 30000); // 30s auto-refresh
        }

        logoutBtn.addEventListener("click", () => {
          const _revTok = sessionStorage.getItem(TOKEN_KEY); if (_revTok) { try { fetch((typeof getApiBase === "function" ? getApiBase() : "") + "/api/admin", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + _revTok }, body: JSON.stringify({ action: "logout" }) }).catch(() => {}); } catch (_) {} } sessionStorage.removeItem(TOKEN_KEY);
          sessionStorage.removeItem(USERNAME_KEY);
          sessionStorage.removeItem(ROLE_KEY);
          if (refreshInterval) clearInterval(refreshInterval);
          authSection.hidden = false;
          deliveriesSection.hidden = true;
          riderStatusBadge.hidden = true;
          refreshBtn.hidden = true;
          logoutBtn.hidden = true;
          loginBtn.disabled = false;
          loginBtn.innerHTML = `<i class="fa-solid fa-unlock-keyhole"></i> Sign In to Rider Console`;
          showToast("Rider Console locked.");
        });

        refreshBtn.addEventListener("click", () => {
          refreshBtn.innerHTML = `<i class="fa-solid fa-rotate fa-spin"></i>`;
          fetchDeliveries().finally(() => {
            setTimeout(() => {
              refreshBtn.innerHTML = `<i class="fa-solid fa-rotate"></i>`;
            }, 500);
          });
        });

        // Tabs
        tabChips.forEach((chip) => {
          chip.addEventListener("click", () => {
            tabChips.forEach((c) => c.classList.remove("active"));
            chip.classList.add("active");
            activeFilter = chip.dataset.filter;
            renderDeliveries();
          });
        });

        driverSearch.addEventListener("input", renderDeliveries);

        async function fetchDeliveries() {
          const token = sessionStorage.getItem(TOKEN_KEY);
          if (!token) return;

          try {
            const res = await fetch(`${getApiBase()}/api/admin?limit=200`, {
              method: "GET",
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
              if (res.status === 401) {
                logoutBtn.click();
              }
              return;
            }

            currentOrders = Array.isArray(data.orders) ? data.orders : [];
            updateTabCounts();
            renderDeliveries();
          } catch (_) {}
        }

        function updateTabCounts() {
          const deliveryOrders = currentOrders.filter((o) => (o.fulfilment || "").toLowerCase() === "delivery");
          const activeCount = deliveryOrders.filter((o) => ["preparing", "ready", "out_for_delivery"].includes(o.status)).length;
          const readyCount = deliveryOrders.filter((o) => o.status === "ready").length;
          const outCount = deliveryOrders.filter((o) => o.status === "out_for_delivery").length;
          const prepCount = deliveryOrders.filter((o) => o.status === "preparing").length;
          const compCount = deliveryOrders.filter((o) => o.status === "completed").length;

          document.getElementById("count-active").textContent = activeCount;
          document.getElementById("count-ready").textContent = readyCount;
          document.getElementById("count-out").textContent = outCount;
          document.getElementById("count-preparing").textContent = prepCount;
          document.getElementById("count-completed").textContent = compCount;
          document.getElementById("count-all").textContent = deliveryOrders.length;
        }

        // Package Summarizer (Pizza Boxes, Sides, Drinks)
        function summarizePackages(itemsText) {
          const raw = String(itemsText || "");
          const lines = raw.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean);

          let pizzaCount = 0;
          let sidesCount = 0;
          let drinksCount = 0;
          const pizzaList = [];
          const sideList = [];
          const drinkList = [];

          for (const item of lines) {
            const lower = item.toLowerCase();
            const qtyMatch = item.match(/^(\d+)\s*x/i) || item.match(/^(\d+)\s+/);
            const qty = qtyMatch ? parseInt(qtyMatch[1], 10) : 1;

            if (
              lower.includes("coca-cola") ||
              lower.includes("coke") ||
              lower.includes("fanta") ||
              lower.includes("sprite") ||
              lower.includes("water") ||
              lower.includes("drink") ||
              lower.includes("cl")
            ) {
              drinksCount += qty;
              drinkList.push(item);
            } else if (
              lower.includes("wings") ||
              lower.includes("shawarma") ||
              lower.includes("waffle") ||
              lower.includes("cone") ||
              lower.includes("fries") ||
              lower.includes("bread") ||
              lower.includes("side")
            ) {
              sidesCount += qty;
              sideList.push(item);
            } else {
              pizzaCount += qty;
              pizzaList.push(item);
            }
          }

          if (pizzaCount === 0 && pizzaList.length > 0) pizzaCount = pizzaList.length;

          return { pizzaCount, sidesCount, drinksCount, raw };
        }

        function formatMoney(amount) {
          return "₦" + Number(amount || 0).toLocaleString("en-NG");
        }

        function formatTimeAgo(ts) {
          try {
            const d = new Date(ts);
            if (isNaN(d.getTime())) return "Recently";
            return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          } catch (_) {
            return "Recently";
          }
        }

        function buildWhatsAppLink(phone, customerName, orderId) {
          const digits = String(phone || "").replace(/\D/g, "");
          let waNumber = digits;
          if (waNumber.startsWith("0") && waNumber.length === 11) {
            waNumber = "234" + waNumber.slice(1);
          }
          const msg = encodeURIComponent(`Hello ${customerName || "there"}, this is your Coldberry Ice Cream delivery rider regarding order #${orderId}.`);
          return `https://wa.me/${waNumber}?text=${msg}`;
        }

        function buildGoogleMapsLink(address, location) {
          const fullQuery = [address, location, "Nigeria"].filter(Boolean).join(", ");
          return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fullQuery)}`;
        }

        function renderDeliveries() {
          const query = driverSearch.value.trim().toLowerCase();
          const deliveryOrders = currentOrders.filter((o) => (o.fulfilment || "").toLowerCase() === "delivery");

          let filtered = deliveryOrders.filter((o) => {
            const st = (o.status || "pending").toLowerCase();
            if (activeFilter === "active") {
              if (!["preparing", "ready", "out_for_delivery"].includes(st)) return false;
            } else if (activeFilter !== "all" && st !== activeFilter) {
              return false;
            }

            if (query) {
              const hay = `${o.order_id || ""} ${o.customer_name || ""} ${o.customer_phone || ""} ${o.address || ""} ${o.location || ""} ${o.items || ""}`.toLowerCase();
              if (!hay.includes(query)) return false;
            }
            return true;
          });

          // Sort: out_for_delivery first, then ready, then preparing, then completed
          const priority = { out_for_delivery: 1, ready: 2, preparing: 3, completed: 4 };
          filtered.sort((a, b) => {
            const pA = priority[a.status] || 5;
            const pB = priority[b.status] || 5;
            if (pA !== pB) return pA - pB;
            return (Date.parse(b.created_at || 0) || 0) - (Date.parse(a.created_at || 0) || 0);
          });

          if (filtered.length === 0) {
            deliveriesList.innerHTML = "";
            emptyState.hidden = false;
            return;
          }

          emptyState.hidden = true;
          deliveriesList.innerHTML = filtered.map(renderDeliveryCard).join("");
        }

        function renderDeliveryCard(order) {
          const id = esc(order.order_id || order.orderId);
          const pin = esc(order.order_pin || order.orderPin || "N/A");
          const customerName = esc(order.customer_name || order.customerName || "Customer");
          const rawPhone = String(order.customer_phone || order.customerPhone || "");
          const phone = esc(rawPhone);
          const safeTelPhone = esc(rawPhone.replace(/[^0-9+]/g, ""));
          const address = esc(order.address || "Delivery address provided with order");
          const location = esc(order.location || "Lagos");
          const status = (order.status || "pending").toLowerCase().replace(/[^a-z_]/g, "");
          const paymentStatus = (order.payment_status || order.paymentStatus || "pending").toLowerCase();
          const isPaid = paymentStatus === "paid" || paymentStatus === "received";
          const grandTotal = Number(order.grand_total || order.grandTotal || 0);
          const timeStr = esc(formatTimeAgo(order.created_at || order.timestamp));

          const pkg = summarizePackages(order.items);
          const mapsUrl = esc(buildGoogleMapsLink(order.address || "Delivery address provided with order", order.location || "Lagos"));
          const waUrl = esc(buildWhatsAppLink(rawPhone, order.customer_name || order.customerName || "Customer", order.order_id || order.orderId));

          // Status Badge Pill
          let pillHtml = "";
          if (status === "preparing") {
            pillHtml = `<span class="status-pill pill-preparing"><i class="fa-solid fa-kitchen-set"></i> Kitchen Baking</span>`;
          } else if (status === "ready") {
            pillHtml = `<span class="status-pill pill-ready"><i class="fa-solid fa-box"></i> Ready for Pickup</span>`;
          } else if (status === "out_for_delivery") {
            pillHtml = `<span class="status-pill pill-out"><i class="fa-solid fa-motorcycle"></i> On the Way</span>`;
          } else if (status === "completed") {
            pillHtml = `<span class="status-pill pill-completed"><i class="fa-solid fa-circle-check"></i> Delivered</span>`;
          } else {
            pillHtml = `<span class="status-pill pill-ready">${esc(status)}</span>`;
          }

          // Payment Badge (PAID vs COLLECT PAYMENT)
          const paymentBannerHtml = isPaid
            ? `<div class="payment-banner paid">
                 <div class="payment-badge-text">
                   <i class="fa-solid fa-circle-check" aria-hidden="true"></i> PAID ONLINE
                 </div>
                 <div style="font-size: 0.82rem; font-weight: 700;">DO NOT COLLECT CASH</div>
               </div>`
            : `<div class="payment-banner collect">
                 <div>
                   <div class="payment-badge-text">
                     <i class="fa-solid fa-hand-holding-dollar" aria-hidden="true"></i> COLLECT PAYMENT
                   </div>
                   <div style="font-size: 0.78rem;">Collect cash / transfer upon delivery</div>
                 </div>
                 <div class="payment-amount">${esc(formatMoney(grandTotal))}</div>
               </div>`;

          // Action Button
          let actionBtnHtml = "";
          if (status === "preparing" || status === "ready") {
            actionBtnHtml = `
              <button
                type="button"
                class="driver-action-btn action-pickup"
                data-action="update-status"
                data-id="${id}"
                data-next-status="out_for_delivery"
              >
                <i class="fa-solid fa-motorcycle" aria-hidden="true"></i> Pick Up &amp; Start Delivery
              </button>
            `;
          } else if (status === "out_for_delivery") {
            actionBtnHtml = `
              <button
                type="button"
                class="driver-action-btn action-complete"
                data-action="update-status"
                data-id="${id}"
                data-next-status="completed"
              >
                <i class="fa-solid fa-circle-check" aria-hidden="true"></i> Handed Over to Customer
              </button>
            `;
          } else if (status === "completed") {
            actionBtnHtml = `
              <div class="delivered-badge-done">
                <i class="fa-solid fa-check-double" aria-hidden="true"></i> Order Delivered &amp; Completed
              </div>
            `;
          }

          return `
            <article class="delivery-card status-${status}" data-order-id="${id}">
              <div class="card-top">
                <div>
                  <div class="card-order-id">#${id}</div>
                  <span class="card-pin"><i class="fa-solid fa-key"></i> PIN: <strong>${pin}</strong></span>
                </div>
                <div style="text-align: right;">
                  <div>${pillHtml}</div>
                  <div class="card-time" style="margin-top: 0.3rem;"><i class="fa-regular fa-clock"></i> ${timeStr}</div>
                </div>
              </div>

              <!-- Customer & Address -->
              <div class="address-section">
                <div class="address-title">
                  <i class="fa-solid fa-location-dot" style="color: var(--coral);"></i> Delivery Address
                </div>
                <div class="address-text">${address}</div>
                <div class="address-sub"><i class="fa-solid fa-city"></i> Zone: ${location}</div>

                <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="driver-btn driver-btn-map" style="width: 100%;">
                  <i class="fa-solid fa-map-location-dot" aria-hidden="true"></i> Open in Google Maps
                </a>
              </div>

              <!-- Customer Contact -->
              <div style="display: flex; justify-content: space-between; align-items: center; margin: 0.5rem 0 0.25rem;">
                <div style="font-weight: 800; font-size: 0.95rem;">
                  <i class="fa-solid fa-user" style="color: var(--muted);"></i> ${customerName}
                </div>
                <div style="font-size: 0.85rem; color: var(--muted); font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;">${phone}</div>
              </div>

              <div class="contact-grid">
                <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="driver-btn driver-btn-wa">
                  <i class="fa-brands fa-whatsapp" aria-hidden="true"></i> WhatsApp
                </a>
                <a href="tel:${safeTelPhone}" class="driver-btn driver-btn-call">
                  <i class="fa-solid fa-phone" aria-hidden="true"></i> Call
                </a>
              </div>

              <!-- Package Breakdown -->
              <div class="packages-summary">
                <div class="packages-header">
                  <span><i class="fa-solid fa-box-check"></i> Package Breakdown</span>
                  <span style="font-weight: 700;">Verify Before Leaving</span>
                </div>
                <div class="package-badges">
                  <span class="pkg-badge" style="border: 1px solid rgba(255,87,51,0.35);">
                    <i class="fa-solid fa-box" aria-hidden="true"></i> <strong>${pkg.pizzaCount}</strong> Pizza Box${pkg.pizzaCount === 1 ? "" : "es"}
                  </span>
                  ${pkg.sidesCount > 0 ? `<span class="pkg-badge" style="border: 1px solid rgba(240,168,59,0.35);"><i class="fa-solid fa-utensils" aria-hidden="true"></i> <strong>${pkg.sidesCount}</strong> Side${pkg.sidesCount === 1 ? "" : "s"}</span>` : ""}
                  ${pkg.drinksCount > 0 ? `<span class="pkg-badge" style="border: 1px solid rgba(13,202,240,0.35);"><i class="fa-solid fa-glass-water" aria-hidden="true"></i> <strong>${pkg.drinksCount}</strong> Drink${pkg.drinksCount === 1 ? "" : "s"}</span>` : ""}
                </div>
                <details style="margin-top: 0.45rem; font-size: 0.8rem; color: var(--muted);">
                  <summary style="cursor: pointer;">Itemized Receipt Details</summary>
                  <div style="margin-top: 0.35rem; white-space: pre-line; color: var(--text);">${esc(pkg.raw)}</div>
                  ${order.notes ? `<div style="margin-top: 0.35rem; color: var(--coral);"><strong>Customer Notes:</strong> ${esc(order.notes)}</div>` : ""}
                </details>
              </div>

              <!-- Payment Status -->
              ${paymentBannerHtml}

              <!-- Action Button -->
              <div style="margin-top: 0.85rem;">
                ${actionBtnHtml}
              </div>
            </article>
          `;
        }

        // Handle Delivery Action Click (Pick Up or Handed Over)
        deliveriesList.addEventListener("click", async (e) => {
          const btn = e.target.closest('button[data-action="update-status"]');
          if (!btn) return;

          const orderId = btn.dataset.id;
          const nextStatus = btn.dataset.nextStatus;
          if (!orderId || !nextStatus) return;

          const label = nextStatus === "out_for_delivery" ? "start delivery" : "confirm delivery handover";
          if (!confirm(`Are you sure you want to ${label} for order #${orderId}?`)) {
            return;
          }

          const originalContent = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Updating...`;

          const token = sessionStorage.getItem(TOKEN_KEY);
          try {
            const res = await fetch(`${getApiBase()}/api/admin`, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ orderId, status: nextStatus }),
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
              showToast(data.error || "Failed to update delivery status.", true);
              btn.disabled = false;
              btn.innerHTML = originalContent;
              return;
            }

            const successMsg =
              nextStatus === "out_for_delivery"
                ? `Order #${orderId} marked OUT FOR DELIVERY `
                : `Order #${orderId} COMPLETED & HANDED OVER `;
            showToast(successMsg);

            // Update local memory & re-render
            const match = currentOrders.find((o) => (o.order_id || o.orderId) === orderId);
            if (match) {
              match.status = nextStatus;
            }
            updateTabCounts();
            renderDeliveries();
          } catch (_) {
            showToast("Network error updating delivery status.", true);
            btn.disabled = false;
            btn.innerHTML = originalContent;
          }
        });

        // Auto-login if session token already active
        const existingToken = sessionStorage.getItem(TOKEN_KEY);
        const existingUser = sessionStorage.getItem(USERNAME_KEY);
        const existingRole = sessionStorage.getItem(ROLE_KEY);
        if (existingToken && existingUser && (existingRole === "driver" || existingRole === "admin")) {
          enterConsoleMode(existingUser, existingRole);
        }
      })();
    </script>
  
    <script id="ops-theme-polarity-sync">
      (function(){
        const syncIcon = () => {
          const btn = document.getElementById("theme-toggle");
          if (!btn) return;
          const isDark = document.documentElement.getAttribute("data-theme") === "dark";
          btn.innerHTML = isDark ? '<i class="fa-solid fa-sun" aria-hidden="true"></i>' : '<i class="fa-solid fa-moon" aria-hidden="true"></i>';
          btn.setAttribute("aria-pressed", String(isDark));
        };
        syncIcon();
        const obs = new MutationObserver(syncIcon);
        obs.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      })();
    </script>
  
    <footer class="ops-footer">
      <span>&copy; 2026 Coldberry Ice Cream Nigeria &middot; Internal Operations</span>
      <a href="../index.html">&larr; Return to Coldberry Storefront</a>
    </footer>
  </body>
</html>
